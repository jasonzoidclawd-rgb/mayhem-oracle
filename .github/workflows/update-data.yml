name: Update Data

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 06:00 Taipei
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm install

      - name: Regenerate internal data and export public catalogs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./scripts/update-data.sh

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/internal public/data ':!public/data/patch-notes.json'
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
          git push

      # Vercel auto-deploys on push via GitHub integration — no explicit step needed
