<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#05070d" />
<title>Mayhem Oracle — Companion (second-screen prototype)</title>
<meta name="description" content="In-game second-screen augment scoring. Tap the 3 augments you were offered → instant keep/reroll verdict." />
<!--
  Companion Mode prototype — docs/mobile-first-companion-addendum-2026-06.md §3
  The phone-as-second-screen live flow: warm path = 3 taps to verdict (auto-fire on the 3rd).
  Real route: src/app/[locale]/companion/page.tsx → CompanionClient.tsx (calls requestDecision() only,
  NEVER imports src/lib/scoring/ — cross-parity budget stays 0 by construction).
  Augment tiles use initials, not hot-linked icons (addendum §4.3: self-host, never hot-link mid-game).
  Verdicts here are MOCK; production verdicts come only from the gated /api/decision/evaluate.
-->
<style>
:root{
  --bg:#05070d; --bg-2:#0a0e17; --card:#141a27; --card-2:#1a2030;
  --neon:#00d4ff; --neon-2:#7c3aed;
  --text:#f1f5f9; --sec:#94a3b8; --muted:#64748b; --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.18);
  --gold:#ffd700; --silver:#94a3b8; --prismatic:#c896ff;
  --grade-hot:#fbbf24; --grade-strong:#34d399; --grade-steady:#38bdf8; --grade-average:#94a3b8; --grade-weak:#fb7185;
  --keep:#34d399; --consider:#38bdf8; --reroll:#fb7185; --golden:#fbbf24;
  --font-d:"Inter Tight",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --font:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(130% 100% at 50% 0%, var(--bg-2) 0%, var(--bg) 70%) fixed;
  color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.4;
  display:flex; flex-direction:column; min-height:100dvh;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-left)) 0;
}
.app{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}

/* ── Header: champion + context chips (always visible, echoed on verdict) ── */
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.champ{display:flex;align-items:center;gap:10px;min-width:0}
.champ .ava{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#26304a,#0c111c);
  display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:18px;border:1px solid var(--border-2);flex:0 0 auto}
.champ .nm{font-family:var(--font-d);font-weight:800;font-size:18px;line-height:1.05}
.champ .sub{font-size:11.5px;color:var(--muted)}
.top .sp{flex:1}
.gear{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;color:var(--sec);
  background:var(--card);border:1px solid var(--border)}
.chips{display:flex;gap:8px;padding:0 2px 12px}
.chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:46px;justify-content:center;
  background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--text);cursor:pointer}
.chip .k{font-size:9.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.chip b{font-family:var(--font-d);font-weight:800}
.chip.gold b{color:var(--gold)} .chip.silver b{color:var(--silver)} .chip.prismatic b{color:var(--prismatic)}

/* ── Demo state switch (member vs locked) ── */
.demo{display:flex;gap:6px;align-items:center;justify-content:center;padding:0 0 10px;font-size:11px;color:var(--muted)}
.demo button{font-size:11px;color:var(--sec);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer}
.demo button.on{color:var(--neon);border-color:rgba(0,212,255,.4)}

/* ── Prompt + rarity tabs ── */
.prompt{font-size:13px;color:var(--sec);padding:0 2px 8px}
.prompt b{color:var(--text)}
.rtabs{display:flex;gap:8px;padding:0 2px 10px}
.rtab{flex:1;min-height:40px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;
  background:var(--card);border:1px solid var(--border);color:var(--sec)}
.rtab.on{color:var(--text)}
.rtab.on.silver{border-color:var(--silver);background:rgba(148,163,184,.12)}
.rtab.on.gold{border-color:var(--gold);background:rgba(255,215,0,.12);color:var(--gold)}
.rtab.on.prismatic{border-color:var(--prismatic);background:rgba(200,150,255,.12);color:var(--prismatic)}

/* ── Type-ahead ── */
.search{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:15px;padding:0 14px;outline:none;margin-bottom:10px}
.search:focus{border-color:rgba(0,212,255,.45)}

/* ── Augment grid (recognition, not scroll-hunt) ── */
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:2px 2px 12px;align-content:start;-webkit-overflow-scrolling:touch}
.aug{position:relative;min-height:84px;border-radius:14px;border:1px solid var(--border);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:border-color .15s var(--ease),transform .1s var(--ease);padding:8px 6px}
.aug:active{transform:scale(.96)}
.aug .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:15px;color:#0a0e17}
.aug .nm{font-size:11px;color:var(--sec);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.aug.sel{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 18px -6px var(--neon)}
.aug.sel .nm{color:var(--text)}
.aug .pick{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;display:none;
  place-items:center;font-family:var(--font-d);font-weight:800;font-size:12px;color:#06121a;background:var(--neon)}
.aug.sel .pick{display:grid}
.aug .mru{position:absolute;top:6px;left:8px;font-size:10px;color:var(--gold)}

/* ── Verdict sheet (slides up; the 2-second glance) ── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);transition:transform .4s var(--ease);
  background:linear-gradient(180deg,var(--card-2),var(--bg-2));border-top:1px solid var(--border-2);
  border-radius:20px 20px 0 0;box-shadow:0 -20px 60px -20px #000;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.up{transform:translateY(0)}
.sheet .ctx{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--sec);margin-bottom:12px}
.sheet .ctx .x{margin-left:auto;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;width:32px;height:32px;display:grid;place-items:center}
.rings{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.rcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .g{font-family:var(--font-d);font-weight:800;font-size:24px}
.rcol .an{font-size:11px;color:var(--sec);text-align:center;line-height:1.15;max-width:84px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rcol .gl{font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:700}

/* shape-coded stance pill (NOT color-only — dark-room + colorblind safe) */
.stance{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:14px;
  font-family:var(--font-d);font-weight:800;font-size:20px;letter-spacing:.3px}
.stance .gly{font-size:22px}
.stance.keep{background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.5);color:var(--keep)}
.stance.reroll{background:rgba(251,113,133,.16);border:1px solid rgba(251,113,133,.5);color:var(--reroll)}
.stance.golden{background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.55);color:var(--golden)}
.reasons{margin-top:10px}
.reasons summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--neon);padding:6px 0}
.reasons summary::-webkit-details-marker{display:none}
.reasons ul{margin:4px 0 0;padding-left:18px;color:var(--sec);font-size:12.5px}
.reasons li{margin:3px 0}
.next{display:flex;gap:10px;margin-top:12px}
.next button{flex:1;min-height:50px;border-radius:13px;font-family:var(--font-d);font-weight:800;font-size:15px;cursor:pointer}
.next .undo{flex:0 0 33%;background:var(--card);border:1px solid var(--border);color:var(--sec)}
.next .go{background:linear-gradient(135deg,var(--neon-2),var(--neon));border:0;color:#06121a}

/* locked (fail-closed) — blurred placeholder rings, no real verdict */
.locked .ring .g{filter:blur(6px);color:var(--muted)}
.locked .rcol .an{filter:blur(3px)}
.locked .stance{background:var(--card);border:1px dashed var(--border-2);color:var(--sec);font-size:15px}
.locked .reasons{display:none}
.lockcta{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.lockcta a{color:var(--neon);font-weight:700}

/* footer hint */
.hint{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 12px}
.hint a{color:var(--neon)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:var(--card-2);
  border:1px solid var(--border-2);border-radius:10px;padding:8px 14px;font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .sheet{transition:none}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">

  <!-- champion sticky from last game + context chips (echoed on verdict) -->
  <div class="top">
    <div class="champ">
      <div class="ava" id="ava">Ah</div>
      <div><div class="nm" id="champName">Ahri</div><div class="sub">Competitive · sticky from last game</div></div>
    </div>
    <div class="sp"></div>
    <div class="gear" id="wake" title="Keep screen on">☀</div>
    <div class="gear" title="Settings">⚙</div>
  </div>

  <div class="demo">
    demo state:
    <button id="dMember" class="on">Member</button>
    <button id="dLocked">Locked</button>
  </div>

  <div class="chips">
    <div class="chip" id="chRound"><span class="k">Round</span><b id="roundV">2</b></div>
    <div class="chip" id="chMode"><span class="k">Mode</span><b>COMP</b></div>
    <div class="chip gold" id="chRarity"><span class="k">Rarity</span><b id="rarityV">GOLD</b></div>
    <div class="chip" id="chReroll"><span class="k">Rerolls</span><b>1</b></div>
  </div>

  <div class="prompt">Tap the <b>3 augments</b> you were offered <span id="selN" class="sec">(0/3)</span></div>

  <div class="rtabs">
    <button class="rtab silver" data-r="silver">Silver</button>
    <button class="rtab gold on" data-r="gold">Gold</button>
    <button class="rtab prismatic" data-r="prismatic">Prismatic</button>
  </div>

  <input class="search" id="search" placeholder="Filter augments…" autocomplete="off" />

  <div class="grid" id="grid"></div>
</div>

<!-- verdict sheet -->
<div class="sheet" id="sheet">
  <div class="ctx"><span id="ctxLine">Ahri · R2 · GOLD</span><span class="x" id="closeSheet">×</span></div>
  <div class="rings" id="rings"></div>
  <div class="stance" id="stance"></div>
  <div class="lockcta" id="lockcta" style="display:none">🔒 Used every game. <a href="#">Sign in to score →</a></div>
  <details class="reasons" id="reasons"><summary>Why this verdict ▾</summary><ul id="reasonList"></ul></details>
  <div class="next">
    <button class="undo" id="undo">↩ Undo</button>
    <button class="go" id="nextRound">Next round ▸</button>
  </div>
</div>

<div class="hint">Prototype · auto-fires on the 3rd tap · <a href="dashboard.html">← Dashboard</a></div>

<script>
/* ── Mock augment pool by rarity (initials + hue; no hot-linked icons — addendum §4.3) ── */
const POOL = {
  silver: ["Tracker","Magic Missile","Cresc. Strike","Goredrink","Stackosaurus","Erosion","Combat Caster","Recursion","Tank It Or Leave It","Center of the Universe","Phenom. Evil","Slow Cooker"],
  gold: ["Tank Engine","Lethal Tempo","Gusto","Ironclad","Soul Siphon","Big Brain","Apex Inventor","Demon's Dance","Mind to Matter","Symphony of War","First Aid Kit","Cleanup Crew","Blue Streak","Holy Fire"],
  prismatic: ["Prismatic Egg","Light 'em Up","Ult. Unstoppable","Dematerialize","Jeweled Gauntlet","Twice Thrice","Infernal Conduit","Spin to Win","Goliath","Perfect Timing"]
};
const MRU = new Set(["Tank Engine","Lethal Tempo","Soul Siphon"]); // recent/favorites floated to top
/* deterministic mock "score" → grade (real grades come from /api/decision/evaluate) */
const GRADES = [
  {key:"hot",label:"HOT",color:"var(--grade-hot)"},
  {key:"strong",label:"STRONG",color:"var(--grade-strong)"},
  {key:"steady",label:"STEADY",color:"var(--grade-steady)"},
  {key:"average",label:"AVERAGE",color:"var(--grade-average)"},
  {key:"weak",label:"WEAK",color:"var(--grade-weak)"}
];
function mockScore(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return h%100; }
function gradeFor(s){ return s>78?GRADES[0]:s>58?GRADES[1]:s>40?GRADES[2]:s>22?GRADES[3]:GRADES[4]; }
const REASONS = {
  hot:["Huge synergy with this champion's kit","Top-quartile win rate this patch","Scales into your power spikes"],
  strong:["Strong fit for your damage profile","Above-average win rate","Reliable across team comps"],
  steady:["Solid, low-variance pick","Neutral matchup fit"],
  average:["Playable but unremarkable here","Better options often appear"],
  weak:["Weak fit for this champion","Below-average win rate — consider reroll"]
};
const hue = n => `hsl(${mockScore(n)*3.6} 70% 55%)`;

let rarity="gold", selected=[], member=true, round=2, fireTimer=null;
const $=id=>document.getElementById(id);

function renderGrid(){
  const q=$("search").value.toLowerCase();
  let list=POOL[rarity].filter(n=>n.toLowerCase().includes(q));
  list.sort((a,b)=>(MRU.has(b)-MRU.has(a))); // MRU floated to top
  $("grid").innerHTML=list.map(n=>{
    const sel=selected.indexOf(n), on=sel>=0;
    return `<button class="aug ${on?'sel':''}" data-n="${n}">
      ${MRU.has(n)?'<span class="mru">★</span>':''}
      <span class="pick">${on?sel+1:''}</span>
      <span class="ic" style="background:${hue(n)}">${n.replace(/[^A-Za-z ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</span>
      <span class="nm">${n}</span></button>`;
  }).join("");
}
function setSel(n){
  const i=selected.indexOf(n);
  if(i>=0) selected.splice(i,1);
  else { if(selected.length>=3){ toast("3 already picked — tap one to remove"); return; } selected.push(n); }
  $("selN").textContent=`(${selected.length}/3)`;
  renderGrid();
  clearTimeout(fireTimer);
  if(selected.length===3) fireTimer=setTimeout(fire,250); // AUTO-FIRE on 3rd tap (250ms debounce)
}
function fire(){
  const ranked=selected.map(n=>({n,s:mockScore(n)})).sort((a,b)=>b.s-a.s);
  $("ctxLine").textContent=`${$("champName").textContent} · R${round} · ${rarity.toUpperCase()}`;
  $("rings").innerHTML=ranked.map(({n,s})=>{ const g=gradeFor(s); const pct=Math.round(s); const C=2*Math.PI*32;
    return `<div class="rcol"><div class="ring">
      <svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="32" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
        <circle cx="37" cy="37" r="32" fill="none" stroke="${g.color}" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <span class="g" style="color:${g.color}">${"SABCD"[GRADES.indexOf(g)]}</span></div>
      <div class="gl" style="color:${g.color}">${g.label}</div><div class="an">${n}</div></div>`;
  }).join("");

  const best=ranked[0], bg=gradeFor(best.s);
  const sh=$("sheet"), st=$("stance");
  if(member){
    sh.classList.remove("locked"); $("lockcta").style.display="none";
    const isGolden = rarity==="prismatic" && bg.key==="hot";
    const keep = bg.key==="hot"||bg.key==="strong"||bg.key==="steady";
    st.className="stance "+(isGolden?"golden":keep?"keep":"reroll");
    st.innerHTML = isGolden ? `<span class="gly">★</span> GOLDEN — ${best.n}`
                 : keep ? `<span class="gly">✓</span> KEEP — ${best.n}`
                 : `<span class="gly">↻</span> REROLL`;
    $("reasonList").innerHTML=REASONS[bg.key].map(r=>`<li>${r}</li>`).join("");
  } else {
    sh.classList.add("locked"); $("lockcta").style.display="flex";
    st.className="stance"; st.innerHTML="🔒 Verdict locked";
  }
  sh.classList.add("up");
}
function closeSheet(){ $("sheet").classList.remove("up"); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1400); }

/* events */
$("grid").addEventListener("click",e=>{ const b=e.target.closest(".aug"); if(b) setSel(b.dataset.n); });
$("search").addEventListener("input",renderGrid);
document.querySelectorAll(".rtab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".rtab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); rarity=t.dataset.r;
  $("rarityV").textContent=rarity.toUpperCase();
  $("chRarity").className="chip "+rarity;
  selected=[]; $("selN").textContent="(0/3)"; closeSheet(); renderGrid();
  toast("Rarity changed — auto-advance paused this game");
}));
$("closeSheet").addEventListener("click",closeSheet);
$("undo").addEventListener("click",()=>{ selected.pop(); $("selN").textContent=`(${selected.length}/3)`; closeSheet(); renderGrid(); });
$("nextRound").addEventListener("click",()=>{ round++; $("roundV").textContent=round; selected=[]; $("selN").textContent="(0/3)"; closeSheet(); renderGrid(); toast(`Round ${round} — pick your 3`); });
$("dMember").addEventListener("click",()=>{ member=true; $("dMember").classList.add("on"); $("dLocked").classList.remove("on"); if(selected.length===3) fire(); });
$("dLocked").addEventListener("click",()=>{ member=false; $("dLocked").classList.add("on"); $("dMember").classList.remove("on"); if(selected.length===3) fire(); });
$("wake").addEventListener("click",async()=>{
  try{ if("wakeLock" in navigator){ await navigator.wakeLock.request("screen"); $("wake").style.color="var(--neon)"; toast("Screen will stay on"); } else toast("Wake Lock not supported here"); }
  catch(_){ toast("Wake Lock unavailable"); }
});

renderGrid();
</script>
</body>
</html>
