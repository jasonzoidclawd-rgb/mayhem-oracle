[package]
name = "mayhem-oracle-overlay"
version = "0.1.0"
description = "ARAM Mayhem augment overlay"
authors = ["jason"]
edition = "2021"

[lib]
name = "mayhem_oracle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
base64 = "0.22"
xcap = "0.9"
rusty-tesseract = "1.1"
image = "0.25"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
